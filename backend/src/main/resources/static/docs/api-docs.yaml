openapi: 3.0.0
info:
  title: FitnessApp API
  description: API documentation for the FitnessApp backend
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/auth/mock-register:
    post:
      summary: Mock user registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User registered successfully
  /api/auth/mock-login:
    post:
      summary: Mock user login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /api/activities:
    post:
      summary: Log an activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                type:
                  type: string
                duration:
                  type: integer
                intensity:
                  type: string
      responses:
        '200':
          description: Activity logged successfully
    get:
      summary: Retrieve activities
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    userId:
                      type: string
                    type:
                      type: string
                    duration:
                      type: integer
                    intensity:
                      type: string
  /api/exercises:
    post:
      summary: Create an exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bodyParts]
              properties:
                name:
                  type: string
                notes:
                  type: string
                bodyParts:
                  type: array
                  items:
                    type: string
                    enum: [CHEST, BACK, SHOULDERS, BICEPS, TRICEPS, QUADS, HAMSTRINGS, GLUTES, CALVES, ABS, ARMS, LEGS, FULLBODY, CARDIO]
      responses:
        '201':
          description: Exercise created
        '400':
          description: Validation error (blank name, empty or unknown body part)
    get:
      summary: List exercises
      responses:
        '200':
          description: List of exercises
  /api/routines:
    post:
      summary: Create a routine with exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, exercises]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [UPPER, LOWER, FULLBODY]
                exercises:
                  type: array
                  items:
                    type: object
                    properties:
                      exerciseId:
                        type: integer
                      defaultSets:
                        type: integer
      responses:
        '201':
          description: Routine created
        '400':
          description: Validation error
    get:
      summary: List routines
      responses:
        '200':
          description: List of routines
  /api/routines/{id}:
    get:
      summary: Get a routine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Routine detail
        '404':
          description: Routine not found
    put:
      summary: Update a routine (replaces name, type and exercise entries)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [UPPER, LOWER, FULLBODY]
                exercises:
                  type: array
                  items:
                    type: object
                    properties:
                      exerciseId:
                        type: integer
                      defaultSets:
                        type: integer
      responses:
        '200':
          description: Routine updated
        '404':
          description: Routine not found
    delete:
      summary: Delete a routine (past sessions are kept)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Routine deleted
        '404':
          description: Routine not found
  /api/sessions:
    post:
      summary: Start a workout session from a routine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routineId]
              properties:
                routineId:
                  type: integer
                overrides:
                  type: object
                  description: Optional per-exercise set overrides for this session only (key = exercise id as string)
                  additionalProperties:
                    type: integer
      responses:
        '201':
          description: Session started with the routine's plan snapshot
        '404':
          description: Routine not found
    get:
      summary: List session history (most recent first)
      responses:
        '200':
          description: List of sessions
  /api/sessions/{id}:
    get:
      summary: Get a session with its planned exercises
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Session detail
        '404':
          description: Session not found
  /api/sessions/{id}/complete:
    post:
      summary: Complete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Session completed
        '404':
          description: Session not found
        '409':
          description: Session already completed
  /api/sessions/{id}/sets:
    post:
      summary: Record a performed set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reps, weight]
              properties:
                reps:
                  type: integer
                weight:
                  type: number
      responses:
        '201':
          description: Set recorded
        '400':
          description: Validation error (reps <= 0 or weight < 0)
        '404':
          description: Session not found
    get:
      summary: List recorded sets for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of set records
components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
        duration:
          type: integer
        intensity:
          type: string